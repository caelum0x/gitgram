openapi: 3.1.0
info:
  title: AITimeMachine API
  description: Cloud sync, checkpoint management, and AI development time-travel API.
  version: 1.0.0
  contact:
    name: AITimeMachine Team

servers:
  - url: /v1
    description: V1 API (primary)
  - url: /api
    description: Legacy API (backwards compatibility)

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer token using an aitm_ prefixed API key"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Success:
      type: object
      properties:
        success:
          type: boolean

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rootPath:
          type: string
        userId:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Checkpoint:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        parentId:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
        manifestHash:
          type: string
        rootTreeHash:
          type: string
        triggerType:
          type: string
        linkedCheckpointId:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object

    Blob:
      type: object
      properties:
        hash:
          type: string
        userId:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        content:
          type: string
          description: Base64 encoded content
        storageType:
          type: string

    ChatSession:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        tool:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        metadata:
          type: object

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        projectId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        timestamp:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        allowedIps:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]

    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastTriggeredAt:
          type: string
          format: date-time
        failureCount:
          type: integer

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Consent:
      type: object
      properties:
        id:
          type: string
        consentType:
          type: string
          enum: [operational_capture, training_export]
        granted:
          type: boolean
        projectId:
          type: string
        organizationId:
          type: string
        grantedByUserId:
          type: string
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    RetentionPolicy:
      type: object
      properties:
        id:
          type: string
        dataClass:
          type: string
        retentionDays:
          type: integer
        hardDelete:
          type: boolean
        projectId:
          type: string
        organizationId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TreeEntry:
      type: object
      properties:
        hash:
          type: string
        parentPath:
          type: string
        entries:
          type: array
          items:
            type: object

    ExportJob:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        type:
          type: string
          enum: [training, analytics, full]
        format:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
        stats:
          type: object
        error:
          type: string

paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  version:
                    type: string
                  uptime:
                    type: number
                  uptimeFormatted:
                    type: string

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      operationId: getHealthLive
      responses:
        "200":
          description: Process is running

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks DB connectivity)
      security: []
      operationId: getHealthReady
      responses:
        "200":
          description: Server is ready to accept traffic
        "503":
          description: Server is not ready

  # ===========================================================================
  # Auth
  # ===========================================================================
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user info
      operationId: getAuthMe
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  plan:
                    type: string

  # ===========================================================================
  # API Keys
  # ===========================================================================
  /v1/keys:
    get:
      tags: [Keys]
      summary: List all API keys
      operationId: listKeys
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
                  total:
                    type: integer
    post:
      tags: [Keys]
      summary: Create a new API key
      operationId: createKey
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expiresAt:
                  type: string
                  format: date-time
                allowedIps:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: API key created (key shown only once)

  /v1/keys/{id}:
    get:
      tags: [Keys]
      summary: Get API key details
      operationId: getKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key details
        "404":
          description: Key not found
    delete:
      tags: [Keys]
      summary: Revoke an API key
      operationId: revokeKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key revoked
        "404":
          description: Key not found
    patch:
      tags: [Keys]
      summary: Update API key metadata (name, expiration, IPs)
      operationId: updateKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                allowedIps:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Key updated

  /v1/keys/{id}/scopes:
    patch:
      tags: [Keys]
      summary: Update API key scopes
      operationId: updateKeyScopes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Scopes updated

  /v1/keys/scopes/available:
    get:
      tags: [Keys]
      summary: List available scopes
      operationId: listAvailableScopes
      responses:
        "200":
          description: Available scopes

  # ===========================================================================
  # Sessions
  # ===========================================================================
  /v1/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      operationId: listSessions
      responses:
        "200":
          description: List of sessions

  /v1/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Delete a session
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session deleted

  /v1/sessions/cleanup:
    post:
      tags: [Sessions]
      summary: Cleanup expired sessions
      operationId: cleanupSessions
      responses:
        "200":
          description: Sessions cleaned up

  # ===========================================================================
  # Audit
  # ===========================================================================
  /v1/audit:
    get:
      tags: [Audit]
      summary: List audit logs with filtering and pagination
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
        - name: end_date
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated list of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /v1/audit/summary:
    get:
      tags: [Audit]
      summary: Get audit activity summary
      operationId: getAuditSummary
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Audit activity summary

  /v1/audit/actions:
    get:
      tags: [Audit]
      summary: List available audit action types
      operationId: listAuditActions
      responses:
        "200":
          description: Available audit action types

  /v1/audit/{logId}:
    get:
      tags: [Audit]
      summary: Get a specific audit log entry
      operationId: getAuditLog
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit log entry
        "404":
          description: Log not found

  # ===========================================================================
  # Sync
  # ===========================================================================
  /v1/sync/projects:
    post:
      tags: [Sync]
      summary: Sync a project
      operationId: syncProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
                rootPath:
                  type: string
      responses:
        "200":
          description: Project synced

  /v1/sync/checkpoints:
    post:
      tags: [Sync]
      summary: Sync a checkpoint
      operationId: syncCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, projectId, name, manifestHash]
              properties:
                id:
                  type: string
                projectId:
                  type: string
                parentId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                scope:
                  type: string
                manifestHash:
                  type: string
                rootTreeHash:
                  type: string
                triggerType:
                  type: string
                linkedCheckpointId:
                  type: string
                createdAt:
                  type: string
                metadata:
                  type: object
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      hash:
                        type: string
                      size:
                        type: number
                      mode:
                        type: number
      responses:
        "200":
          description: Checkpoint synced

  /v1/sync/checkpoints/batch:
    post:
      tags: [Sync]
      summary: Batch sync checkpoints
      operationId: batchSyncCheckpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoints]
              properties:
                checkpoints:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Batch sync results

  /v1/sync/blobs:
    post:
      tags: [Sync]
      summary: Sync a blob (file content)
      operationId: syncBlob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash, size, content]
              properties:
                hash:
                  type: string
                size:
                  type: integer
                mimeType:
                  type: string
                content:
                  type: string
                  description: Base64 encoded
      responses:
        "200":
          description: Blob synced

  /v1/sync/blobs/check:
    post:
      tags: [Sync]
      summary: Check which blobs already exist
      operationId: checkBlobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Existing and missing blob hashes

  /v1/sync/sessions:
    post:
      tags: [Sync]
      summary: Sync a chat session
      operationId: syncSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, projectId, tool]
              properties:
                id:
                  type: string
                projectId:
                  type: string
                tool:
                  type: string
                startedAt:
                  type: string
                endedAt:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: Session synced

  /v1/sync/messages:
    post:
      tags: [Sync]
      summary: Sync a chat message
      operationId: syncMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, projectId, role, content]
              properties:
                sessionId:
                  type: string
                projectId:
                  type: string
                checkpointId:
                  type: string
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
                contentHash:
                  type: string
                isContextInjection:
                  type: boolean
                timestamp:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: Message synced

  /v1/sync/messages/batch:
    post:
      tags: [Sync]
      summary: Batch sync messages
      operationId: batchSyncMessages
      responses:
        "200":
          description: Batch sync results

  /v1/sync/tool-calls:
    post:
      tags: [Sync]
      summary: Sync a tool call
      operationId: syncToolCall
      responses:
        "200":
          description: Tool call synced

  /v1/sync/terminal-events:
    post:
      tags: [Sync]
      summary: Sync a terminal event
      operationId: syncTerminalEvent
      responses:
        "200":
          description: Terminal event synced

  /v1/sync/events:
    post:
      tags: [Sync]
      summary: Sync a generic event
      operationId: syncEvent
      responses:
        "200":
          description: Event synced

  /v1/sync/quota:
    get:
      tags: [Sync]
      summary: Get current storage quota and usage
      operationId: getQuota
      responses:
        "200":
          description: Storage quota info

  /v1/sync/quota/recalculate:
    post:
      tags: [Sync]
      summary: Recalculate storage usage
      operationId: recalculateQuota
      responses:
        "200":
          description: Quota recalculated

  # ===========================================================================
  # Restore
  # ===========================================================================
  /v1/restore/projects:
    get:
      tags: [Restore]
      summary: List user projects
      operationId: listProjects
      responses:
        "200":
          description: List of projects

  /v1/restore/projects/{projectId}:
    get:
      tags: [Restore]
      summary: Get project details
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
        "404":
          description: Project not found

  /v1/restore/projects/{projectId}/checkpoints:
    get:
      tags: [Restore]
      summary: List checkpoints for a project
      operationId: listCheckpoints
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of checkpoints

  /v1/restore/projects/{projectId}/checkpoints/last-green:
    get:
      tags: [Restore]
      summary: Find last passing checkpoint
      operationId: getLastGreenCheckpoint
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Last green checkpoint
        "404":
          description: No green checkpoint found

  /v1/restore/projects/{projectId}/checkpoints/{checkpointId}:
    get:
      tags: [Restore]
      summary: Get checkpoint details
      operationId: getCheckpoint
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: checkpointId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkpoint details
        "404":
          description: Checkpoint not found

  /v1/restore/projects/{projectId}/checkpoints/{checkpointId}/manifest:
    get:
      tags: [Restore]
      summary: Get checkpoint manifest for restore
      operationId: getCheckpointManifest
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: checkpointId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkpoint with manifest

  /v1/restore/projects/{projectId}/checkpoints/{checkpointId}/full:
    get:
      tags: [Restore]
      summary: Full context restore (checkpoint + messages + terminal events)
      operationId: getFullRestore
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: checkpointId
          in: path
          required: true
          schema:
            type: string
        - name: includeMessages
          in: query
          schema:
            type: string
            default: "true"
        - name: messageLimit
          in: query
          schema:
            type: string
            default: "20"
      responses:
        "200":
          description: Full restore data

  /v1/restore/blobs/{hash}:
    get:
      tags: [Restore]
      summary: Get a blob by hash
      operationId: getBlob
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blob content
        "404":
          description: Blob not found

  /v1/restore/blobs/batch:
    post:
      tags: [Restore]
      summary: Batch get blobs
      operationId: batchGetBlobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Batch blob results

  /v1/restore/projects/{projectId}/sessions:
    get:
      tags: [Restore]
      summary: List chat sessions for a project
      operationId: listProjectSessions
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sessions

  /v1/restore/projects/{projectId}/sessions/{sessionId}/messages:
    get:
      tags: [Restore]
      summary: Get messages for a session
      operationId: getSessionMessages
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages

  /v1/restore/projects/{projectId}/messages:
    get:
      tags: [Restore]
      summary: Get recent messages for a project
      operationId: getProjectMessages
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages

  /v1/restore/projects/{projectId}/tool-calls:
    get:
      tags: [Restore]
      summary: Get tool calls for a project
      operationId: getProjectToolCalls
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tool calls

  /v1/restore/projects/{projectId}/terminal-events:
    get:
      tags: [Restore]
      summary: Get terminal events for a project
      operationId: getProjectTerminalEvents
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of terminal events

  # ===========================================================================
  # Time (Advanced Restore)
  # ===========================================================================
  /v1/time/restore:
    post:
      tags: [Time]
      summary: Restore to a checkpoint (project/folder/file scope)
      operationId: timeRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                checkpointId:
                  type: string
                restoreTime:
                  type: string
                  format: date-time
                scopeType:
                  type: string
                  enum: [project, folder, file]
                  default: project
                scopePath:
                  type: string
                includeContext:
                  type: boolean
                  default: true
                messageLimit:
                  type: integer
                  default: 50
      responses:
        "200":
          description: Restore result
        "404":
          description: Project or checkpoint not found

