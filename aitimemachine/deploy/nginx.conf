server {
    listen 80;
    server_name timemachine-api.gitgram.app;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name timemachine-api.gitgram.app;

    ssl_certificate /etc/letsencrypt/live/timemachine-api.gitgram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timemachine-api.gitgram.app/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name timemachine.gitgram.app www.timemachine.gitgram.app;
    return 301 https://timemachine.gitgram.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name timemachine.gitgram.app www.timemachine.gitgram.app;

    ssl_certificate /etc/letsencrypt/live/timemachine.gitgram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timemachine.gitgram.app/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
