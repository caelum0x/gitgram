version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitgram-postgres
    environment:
      POSTGRES_USER: gitgram
      POSTGRES_PASSWORD: gitgram_password
      POSTGRES_DB: gitgram
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitgram"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitgram-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://gitgram:gitgram_password@postgres:5432/gitgram
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres_data:

