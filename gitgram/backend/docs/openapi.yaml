  # ===========================================================================
  # Posts
  # ===========================================================================
  /api/v1/posts:
    get:
      tags: [Posts]
      summary: List posts
      security: []
      operationId: getPosts
      responses:
        "200":
          description: List of posts
    post:
      tags: [Posts]
      summary: Create a post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  maxLength: 2200
                  description: Post text content
                mediaUrls:
                  type: array
                  items:
                    type: string
                  description: Media attachment URLs
                repoUrl:
                  type: string
                  description: GitHub repository URL to link
                hashtags:
                  type: array
                  items:
                    type: string
                  description: Hashtags to attach to the post
                checkpointId:
                  type: string
                  description: Optional AITM checkpoint ID to link to this post
                aitmProjectId:
                  type: string
                  description: Optional AITM project ID associated with the checkpoint
                aitmCheckpointRef:
                  description: Optional embedded AITM checkpoint metadata
                  allOf:
                    - $ref: "#/components/schemas/AitmCheckpointRef"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /api/v1/posts/from-checkpoint:
    post:
      tags: [Posts]
      summary: Create a post from an AITM checkpoint
      description: Creates a post directly from an AITimeMachine checkpoint. The post content is auto-generated from checkpoint metadata when no message is provided.
      operationId: createPostFromCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostFromCheckpointRequest"
      responses:
        "201":
          description: Post created from checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Validation error (missing or invalid checkpointId / projectId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

