openapi: 3.1.0
info:
  title: Gitgram API
  description: Social platform for developers with GitHub integration. Share code, collaborate, and discover projects.
  version: 1.0.0
  contact:
    name: Gitgram Team

servers:
  - url: /api/v1
    description: V1 API (primary)
  - url: /api
    description: Legacy API (backwards compatibility)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    AitmCheckpointRef:
      type: object
      description: Snapshot of AITM checkpoint metadata stored with the post
      properties:
        sha:
          type: string
          description: Checkpoint SHA hash
          example: "a1b2c3d4e5f6"
        message:
          type: string
          description: Checkpoint commit message
          example: "Refactor auth middleware"
        files:
          type: array
          description: List of files changed in the checkpoint
          items:
            type: string
          example: ["src/middleware/auth.ts", "src/utils/token.ts"]
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the checkpoint was created
          example: "2026-04-08T12:00:00.000Z"

    Post:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        userId:
          type: string
        content:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        repoUrl:
          type: string
          nullable: true
        repositoryId:
          type: string
          nullable: true
        type:
          type: string
          enum: [POST, CHANGE_STORY]
        aitmCheckpointId:
          type: string
          nullable: true
          description: AITM checkpoint ID linked to this post
        aitmProjectId:
          type: string
          nullable: true
          description: AITM project ID linked to this post
        aitmCheckpointRef:
          nullable: true
          description: Embedded AITM checkpoint metadata snapshot
          allOf:
            - $ref: "#/components/schemas/AitmCheckpointRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            avatar:
              type: string
              nullable: true
            verified:
              type: boolean
        repository:
          type: object
          nullable: true

    CreatePostFromCheckpointRequest:
      type: object
      required:
        - checkpointId
        - projectId
      properties:
        checkpointId:
          type: string
          minLength: 1
          maxLength: 128
          description: AITM checkpoint ID to create the post from
          example: "a1b2c3d4e5f6"
        projectId:
          type: string
          minLength: 1
          maxLength: 128
          description: AITM project ID the checkpoint belongs to
          example: "proj_abc123"
        message:
          type: string
          maxLength: 2200
          description: Optional post message (auto-generated from checkpoint metadata if omitted)
        visibility:
          type: string
          enum: [public, followers, private]
          description: Post visibility level (defaults to public)

paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /:
    get:
      tags: [Info]
      summary: API root info
      security: []
      operationId: getRoot
      responses:
        "200":
          description: API info

  /health:
    get:
      tags: [Health]
      summary: Health check endpoint
      security: []
      operationId: getHealth
