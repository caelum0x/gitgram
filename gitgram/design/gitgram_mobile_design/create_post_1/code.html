<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between shrink-0">
<div class="flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-zinc-900 dark:text-white text-2xl">close</span>
</div>
<h1 class="text-zinc-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">New Post</h1>
<div class="flex w-12 items-center justify-end"></div>
</header>
<main class="flex-1 flex flex-col px-4 pt-4 pb-0">
<!-- ListItem (Project Selector Card) -->
<div class="flex items-center gap-4 bg-zinc-100 dark:bg-zinc-800/50 p-4 min-h-[72px] rounded-xl cursor-pointer">
<div class="flex items-center gap-4 flex-1">
<div class="text-zinc-900 dark:text-white flex items-center justify-center rounded-lg bg-zinc-200 dark:bg-zinc-700 shrink-0 size-12">
<span class="material-symbols-outlined text-2xl">folder_open</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-zinc-900 dark:text-white text-base font-medium leading-normal line-clamp-1">Select a GitHub Project</p>
<p class="text-zinc-500 dark:text-zinc-400 text-sm font-normal leading-normal line-clamp-2">Choose a repository to share</p>
</div>
</div>
<div class="shrink-0">
<div class="text-zinc-900 dark:text-white flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl">chevron_right</span>
</div>
</div>
</div>
<!-- Composer (Description Text Area) -->
<div class="flex items-center pt-4 gap-3 flex-1">
<label class="flex flex-col min-w-40 h-full flex-1">
<div class="flex w-full flex-1 items-stretch h-full">
<div class="flex flex-1 flex-col">
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-auto rounded-xl text-zinc-900 dark:text-white focus:outline-0 focus:ring-0 border border-zinc-200 dark:border-zinc-700 bg-zinc-100 dark:bg-zinc-800/50 focus:border-primary h-auto placeholder:text-zinc-500 dark:placeholder:text-zinc-400 text-base font-normal leading-normal p-4" placeholder="Write a caption... What problem does it solve? What tech stack did you use?"></textarea>
</div>
</div>
</label>
</div>
<!-- Character Counter -->
<div class="flex justify-end px-1 pt-2">
<p class="text-zinc-500 dark:text-zinc-400 text-xs font-normal">0/500</p>
</div>
</main>
<!-- SingleButton (Share Button) -->
<footer class="p-4 pt-3 mt-auto">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] opacity-50 cursor-not-allowed" disabled="">
<span class="truncate">Share</span>
</button>
</footer>
</div>
</body></html>
