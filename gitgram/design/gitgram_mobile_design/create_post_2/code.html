<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // GitHub Dark Theme Palette
            "gh-dark-bg": "#0d1117", // background
            "gh-dark-bg-secondary": "#161b22", // surface
            "gh-dark-border": "#30363d",
            "gh-dark-text": "#c9d1d9", // on-surface
            "gh-dark-text-secondary": "#8b949e", // on-surface-variant
            "gh-dark-blue": "#58a6ff", // primary
            "gh-dark-green": "#238636",
            "gh-dark-green-hover": "#2ea043"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"]
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
    body {
      min-height: 100dvh;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-sans bg-gh-dark-bg text-gh-dark-text antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col bg-gh-dark-bg">
<header class="flex items-center p-4 shrink-0 border-b border-gh-dark-border">
<button class="flex size-10 items-center justify-center">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="flex-1 text-center text-base font-semibold">New Post</h1>
<div class="w-10"></div>
</header>
<main class="flex flex-1 flex-col p-4">
<div class="flex items-center gap-4 rounded-lg bg-gh-dark-bg-secondary p-4 border border-gh-dark-border">
<div class="flex size-10 items-center justify-center rounded-full bg-gh-dark-border">
<svg aria-hidden="true" class="text-gh-dark-text-secondary" fill="currentColor" height="24" version="1.1" viewBox="0 0 16 16" width="24"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.19.01-.82.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21-.15.46-.55.38A8.013 8.013 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
</div>
<div class="flex-1">
<p class="text-sm font-semibold">username/repo-name</p>
<p class="text-xs text-gh-dark-text-secondary">master</p>
</div>
<button class="rounded-md bg-gh-dark-border px-3 py-1.5 text-sm font-medium hover:bg-opacity-80">
          Change
        </button>
</div>
<div class="mt-4 flex flex-1 flex-col">
<textarea class="flex-grow w-full resize-none rounded-lg border border-gh-dark-border bg-gh-dark-bg p-3 text-sm text-gh-dark-text placeholder:text-gh-dark-text-secondary focus:outline-none focus:ring-2 focus:ring-gh-dark-blue" placeholder="Add a description..."></textarea>
</div>
</main>
<footer class="p-4 pt-2">
<button class="w-full rounded-lg bg-gh-dark-green py-2.5 text-base font-semibold text-white shadow-sm hover:bg-gh-dark-green-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gh-dark-bg focus:ring-gh-dark-green">
        Share
      </button>
</footer>
</div>

</body></html>
