<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3B82F6", // blue-500
            "background-dark": "#121212",
            "surface-dark": "#1E1E1E",
            "on-surface-dark": "#E0E0E0",
            "on-surface-variant-dark": "#9E9E9E",
            "outline-dark": "#424242"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "lg": "1rem",
            "xl": "1.5rem"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
    body {
      min-height: 100dvh;
      background-color: #121212;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-sans bg-background-dark text-on-surface-dark antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-dark">
<header class="flex items-center p-4 shrink-0">
<button class="flex size-10 items-center justify-center">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold">New Post</h1>
<div class="w-10"></div>
</header>
<main class="flex flex-1 flex-col px-4 pt-8 pb-4">
<button class="flex w-full flex-col items-center justify-center gap-4 rounded-xl border-2 border-dashed border-outline-dark bg-surface-dark py-10 text-center">
<div class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary">
<svg class="feather feather-github" fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="font-semibold text-on-surface-dark">Select Project</span>
<span class="text-sm text-on-surface-variant-dark">Choose a repository to share</span>
</div>
</button>
<div class="mt-6 flex-1">
<textarea class="h-48 w-full resize-none rounded-xl border-none bg-surface-dark p-4 text-base text-on-surface-dark placeholder:text-on-surface-variant-dark focus:ring-2 focus:ring-primary focus:ring-opacity-50" placeholder="Add a description..."></textarea>
</div>
</main>
<footer class="p-4 pt-2">
<button class="w-full rounded-lg bg-primary py-3 text-base font-bold text-white shadow-lg shadow-primary/20">
        Share
      </button>
</footer>
</div>

</body></html>
