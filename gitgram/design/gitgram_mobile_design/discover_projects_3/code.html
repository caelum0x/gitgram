<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#388BFD", // A blue similar to GitHub's link color
            "background-dark": "#0D1117", // GitHub dark background
            "border-dark": "#30363D", // GitHub dark border
            "card-dark": "#161B22", // GitHub dark component background

            "text-secondary": "#8B949E", // GitHub dark secondary text
            "accent": "#58A6FF", // GitHub dark accent blue
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.375rem", // 6px
            "lg": "0.5rem", // 8px
            "xl": "0.75rem", // 12px
            "full": "9999px"
          },
        },
      },
    }
  </script>
