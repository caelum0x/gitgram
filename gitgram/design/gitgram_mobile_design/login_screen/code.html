<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - CodeConnect</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4">
<div class="w-full max-w-sm">
<!-- Logo and Headline -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-4xl">code_blocks</span>
<span class="text-white text-2xl font-bold">CodeConnect</span>
</div>
<h1 class="text-white tracking-light text-[28px] font-bold leading-tight text-center">Code, Share, Connect.</h1>
</div>
<!-- Login with GitHub Button -->
<div class="flex px-0 py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-white text-black gap-2 pl-5 text-base font-bold leading-normal tracking-[0.015em] transition-colors hover:bg-gray-200">
<div class="text-black" data-icon="GithubLogo" data-size="24px" data-weight="regular">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path></svg>
</div>
<span class="truncate">Login with GitHub</span>
</button>
</div>
<!-- OR Separator -->
<p class="text-[#9da6b9] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center">or</p>
<!-- Username/Email Field -->
<div class="flex w-full flex-wrap items-end gap-4 px-0 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-white text-base font-medium leading-normal pb-2">Username or Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary border-none bg-[#282e39] h-14 placeholder:text-[#9da6b9] p-4 text-base font-normal leading-normal" placeholder="Enter your username or email" value=""/>
</label>
</div>
<!-- Password Field -->
<div class="flex w-full flex-wrap items-end gap-4 px-0 py-3">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex justify-between items-baseline pb-2">
<p class="text-white text-base font-medium leading-normal">Password</p>
<a class="text-primary/80 hover:text-primary text-sm font-medium transition-colors" href="#">Forgot Password?</a>
</div>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary focus:z-10 border-none bg-[#282e39] h-14 placeholder:text-[#9da6b9] p-4 border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#9da6b9] flex border-none bg-[#282e39] items-center justify-center pr-4 rounded-r-lg cursor-pointer">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- Log In Button -->
<div class="flex px-0 py-3 mt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white gap-2 pl-5 text-base font-bold leading-normal tracking-[0.015em] transition-colors hover:bg-primary/90">
<span class="truncate">Log In</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="mt-6 text-center">
<p class="text-[#9da6b9] text-base font-normal">
                    Don't have an account? 
                    <a class="font-bold text-primary hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</body></html>
