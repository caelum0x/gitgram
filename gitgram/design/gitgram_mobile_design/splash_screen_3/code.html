<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gitgram Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<style>
        .github-pattern {
            background-color: #0D1117;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.1) 1px, transparent 0),
                radial-gradient(circle at 10px 10px, rgba(255,255,255,0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }
        .github-pattern-light {
             background-color: #f6f8fa;
             background-image:
                radial-gradient(circle at 1px 1px, rgba(0,0,0,0.1) 1px, transparent 0),
                radial-gradient(circle at 10px 10px, rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }
    </style>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#3371FF", // A vibrant blue for primary actions
              "background-light": "#f6f8fa",
              "background-dark": "#0D1117",
            },
            fontFamily: {
              display: ["Roboto", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
            },
          },
        },
      };
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="h-screen w-full flex flex-col justify-center items-center bg-background-light dark:bg-background-dark">
<div class="absolute inset-0 github-pattern-light dark:github-pattern"></div>
<div class="relative z-10 flex flex-col items-center justify-center text-center px-4">
<div class="w-32 h-32 mb-6">
<svg class="text-white" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</div>
<h1 class="text-5xl font-bold text-slate-800 dark:text-white tracking-tight">Gitgram</h1>
<p class="mt-4 text-lg text-slate-600 dark:text-slate-400">Share, discover, and connect through code.</p>
</div>
</div>

</body></html>
