<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F0F1A" />
  <title>You're Offline — Gitgram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0F0F1A;
      --surface:  #161b22;
      --border:   #30363d;
      --fg:       #c9d1d9;
      --fg-muted: #8b949e;
      --accent:   #7C3AED;
      --accent-h: #6d28d9;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 2.5rem;
      opacity: 0.6;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }

    .icon-wrap svg {
      width: 48px;
      height: 48px;
      color: var(--accent);
      stroke: currentColor;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--fg-muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 2rem;
    }

    .cached-notice {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: var(--fg-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      margin-bottom: 2rem;
    }

    .cached-notice svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: var(--fg-muted);
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-retry:hover  { background: var(--accent-h); }
    .btn-retry:active { transform: scale(0.97); }

    .btn-retry svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      color: var(--fg-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <span class="logo">gitgram</span>

  <div class="icon-wrap">
    <!-- wifi-off icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <circle cx="12" cy="20" r="1" fill="currentColor"/>
    </svg>
  </div>

  <h1>You're offline</h1>
  <p>It looks like your internet connection is unavailable. Check your network and try again.</p>

  <div class="cached-notice">
    <!-- clock icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    Cached content may still be available
  </div>

  <button class="btn-retry" onclick="window.location.reload()" type="button">
    <!-- refresh-cw icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"/>
      <polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Try again
  </button>

  <p class="footer">&copy; Gitgram. All rights reserved.</p>
</body>
</html>
